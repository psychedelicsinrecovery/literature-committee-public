    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="59.9" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="119.8" fill="#ede9fe" font-size="54" font-weight="700" letter-spacing="-.5">Literature Committee</text><text x="56" y="162.6" fill="#d0cbe3" font-size="23">Writes, reviews and publishes the fellowship's</text><text x="56" y="193.5" fill="#d0cbe3" font-size="23">literature.</text></g>
